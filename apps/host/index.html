<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise AI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint, ahead of React/ThemeProvider, so the
      // correct theme/contrast/text-size/motion is applied immediately —
      // without this, the page would render in the default theme for one
      // frame and then visibly flip to the saved preference.
      (function () {
        try {
          var stored = JSON.parse(
            localStorage.getItem('platform:accessibility-settings') || '{}',
          )
          var mode = stored.colorMode || 'system'
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', isDark)
          root.dataset.contrast = stored.contrast || 'standard'
          root.dataset.textSize = stored.textSize || 'normal'
          root.dataset.motion =
            stored.motion ||
            (window.matchMedia('(prefers-reduced-motion: reduce)').matches
              ? 'reduced'
              : 'normal')
          root.dataset.focusStyle = stored.focusStyle || 'standard'
          root.dataset.keyboardNav = stored.keyboardNav || 'standard'
        } catch {
          /* localStorage unavailable (private mode, etc.) — fall back to defaults */
        }
      })()
    </script>
    <style>
      /* Boot screen. Inlined rather than imported so it paints on the
         first frame — the app's stylesheet, React, and the federated
         remotes all arrive later, and the gap between them was previously
         a blank white (or blank black) page. Reads the same tokens the
         theme script above has already applied to <html>, so it boots
         straight into the user's saved theme instead of flashing. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: oklch(0.984 0.002 247);
        color: oklch(0.145 0 0);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        opacity: 1;
        transition: opacity 260ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.dark #boot {
        background: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }
      /* Set by main.tsx the moment React has rendered. The element stays
         mounted for one transition so it fades rather than cutting. */
      #boot[data-ready] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
      }
      #boot-mark span {
        position: relative;
        display: flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: oklch(0.205 0 0);
        color: oklch(0.985 0 0);
        font-size: 17px;
        font-weight: 600;
      }
      html.dark #boot-mark span {
        background: oklch(0.922 0 0);
        color: oklch(0.205 0 0);
      }
      #boot-mark::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 16px;
        background: currentColor;
        opacity: 0.16;
        animation: boot-halo 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-halo {
        0%, 100% { opacity: 0.1; transform: scale(0.9); }
        50% { opacity: 0.24; transform: scale(1.06); }
      }
      #boot-text {
        font-size: 13px;
        letter-spacing: 0.01em;
        opacity: 0.55;
      }
      #boot-track {
        position: relative;
        width: 168px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.14;
      }
      #boot-track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: currentColor;
        opacity: 1;
        animation: boot-sweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      /* A user who asked for reduced motion gets the same information,
         held still. */
      html[data-motion='reduced'] #boot-mark::before,
      html[data-motion='reduced'] #boot-track::after {
        animation: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div id="boot-mark"><span>E</span></div>
      <div id="boot-track"></div>
      <p id="boot-text">Starting Enterprise AI Platform</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
